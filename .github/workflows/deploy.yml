name: CI and Cloud Run
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm test
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          WIF: ${{ vars.WIF_PROVIDER }}
          DEPLOYER: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
          EXTRA: ${{ vars.BACKEND_URL }}
        run: |
          for name in PROJECT_ID REGION ARTIFACT_REPOSITORY SERVICE WIF DEPLOYER RUNTIME EXTRA; do
            test -n "${!name}" || { echo "Missing repository variable: $name"; exit 1; }
          done
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push container
        id: image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE:$GITHUB_SHA"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ steps.image.outputs.image }}
          env_vars: |-
            BACKEND_AUTH=iam
            OPERATOR_ID=${{ vars.OPERATOR_ID || 'lider-1' }}
            BACKEND_URL=${{ vars.BACKEND_URL }}
          secrets: |-
            OPERATOR_SIGNING_KEY=${{ vars.OPERATOR_SIGNING_KEY_SECRET }}:latest
            OPERATOR_ACCESS_CODE=${{ vars.OPERATOR_ACCESS_CODE_SECRET }}:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.RUNTIME_SERVICE_ACCOUNT }}
            --port=8080 --memory=256Mi --cpu=1
            --min-instances=0 --max-instances=2 --concurrency=8 --timeout=120
      - name: Verify frontend and private backend path
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --retry 3 --retry-delay 2 "$URL/health"
          curl --fail --retry 3 --retry-delay 2 "$URL/api/backend-health"
